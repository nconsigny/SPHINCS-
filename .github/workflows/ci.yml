name: CI

# Added per security-review remediation (steps 3/4/7): there was previously NO automated
# test/KAT/cross-implementation check. These jobs catch:
#   - C13 Rust↔Python signer desync and the full-param cross-impl oracle (C13-S-f1,
#     C13-V-f4) — via cargo test, including the #[ignore]d full-height tests;
#   - SLH-DSA-SHA2 FIPS-205-external conformance — via a pinned, reproducible KAT
#     forge test and real-signature FFI round-trips (SLH-X-f1, SLH-X-f4/f5);
#   - SLH-DSA-SHA2 Python↔C (FIPS reference) primitive parity — via crosscheck.py;
#   - leanSphincs-23-keccak Rust↔Python signer desync, a KAT fixture the sources no
#     longer reproduce, and verifier regressions (KATs, tampering, gas ceiling) — via
#     cargo test, crosscheck.py, make_kat_fixture.py --check and forge test;
#   - the frozen legacy/ verifiers, which live outside the default forge test path
#     and so need an explicit job to be built and run at all.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── C13 signer: fast unit tests + the previously-dead cross-impl oracle +
  #    WOTS+C / FORS+C reuse guards + the full-parameter sign (was #[ignore]d). ──
  rust-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build (also builds the signer-c13 CLI used by the forge FFI fast path)
        working-directory: signers/signer-wasm
        run: cargo build --release
      - name: cargo test (cross_validate oracle, fors_reuse_poc, wots_reuse_poc)
        working-directory: signers/signer-wasm
        run: cargo test --release
      - name: cargo test --ignored (full-param C13 sign + full-height cross-impl checks)
        working-directory: signers/signer-wasm
        run: cargo test --release -- --ignored

  # ── Solidity verifiers + accounts. Sets up every FFI dependency so the full
  #    suite runs, including the pinned SLH external-FIPS KAT and real-signature
  #    round-trips. ──
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python signer deps
        run: pip install eth-account eth-abi requests pycryptodome
      - name: Build C13 Rust signer CLI (fast path for the C13 FFI tests)
        working-directory: signers/signer-wasm
        run: cargo build --release
      - name: Build SLH-DSA-SHA2 C reference signer (FIPS oracle / fast signer backend)
        run: make -C signers/sphincsplus-128-24
      - name: Build leanSphincs-23 Rust signer CLI (ls23k, for the LeanSphincs23 FFI tests)
        working-directory: signers/leansphincs23-keccak
        run: cargo build --release
      - name: forge build
        run: forge build
      - name: forge test
        run: forge test -vv

  # ── SLH-DSA-SHA2 Python↔C (FIPS reference) parity. Run at REDUCED parameters:
  #    a full-param pure-Python sign/verify is hours (see README), and the C
  #    binary's params are compile-time — so we build a REDUCED-parameter C binary
  #    (params.h is -D-overridable) and run crosscheck.py at the matching small
  #    tree, where C and Python must agree bit-for-bit on the shared primitives
  #    (ADRSc packing, Hmsg/MGF1, MSB-first digest parse, WOTS checksum). This is
  #    a fast parity smoke test; full-param C↔Python parity is a manual/offline
  #    step. Validated locally to produce MATCH (identical pk_seed/pk_root/sig).
  slh-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python deps
        run: pip install pycryptodome eth-abi eth-account
      - name: Build REDUCED-parameter C reference signer (h=6, a=8) for a fast crosscheck
        run: make -C signers/sphincsplus-128-24 CFLAGS="-O3 -std=c99 -I. -DSPX_FULL_HEIGHT=6 -DSPX_FORS_HEIGHT=8"
      - name: Python vs C bit-exact parity at the reduced params
        run: |
          SEED=$(python3 -c "print('11'*48)")
          OPTRAND=$(python3 -c "print('00'*16)")
          MSG=deadbeef00000000000000000000000000000000000000000000000000000000
          python3 signers/sphincsplus-128-24/crosscheck.py "$SEED" "$MSG" "$OPTRAND" --h 6 --a 8

  # ── leanSphincs-23 over keccak256 (src/keccak/LeanSphincs-23Asm.sol; signer
  #    signers/leansphincs23-keccak, a Rust port of the upstream crate). Unit tests in
  #    release and in the debug test profile (overflow checks on); the byte-for-byte
  #    Rust↔Python crosscheck on 16 pruned-key vectors, with its spec-literal third
  #    opinion; the Forge KAT fixture, which must still be exactly what the current
  #    sources produce; and the verifier's Forge suites (the --match-contract regex also
  #    selects SphincsAccountLeanSphincs23Test). ls23k is built first: under CI the two
  #    Forge FFI tests fail rather than skip when it is missing, and every consumer
  #    refuses a binary older than the crate sources. The solidity job runs the same
  #    Forge suites again inside the full forge test. ──
  leansphincs23:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python deps
        run: pip install pycryptodome eth-abi
      - name: Build leanSphincs-23 Rust signer CLI (ls23k, for the crosscheck and the Forge FFI tests)
        working-directory: signers/leansphincs23-keccak
        run: cargo build --release
      - name: cargo test --release
        working-directory: signers/leansphincs23-keccak
        run: cargo test --release
      - name: cargo test (debug assertions and overflow checks on)
        working-directory: signers/leansphincs23-keccak
        run: cargo test
      - name: Rust vs Python crosscheck (byte for byte, plus the spec-literal recomputation)
        run: python3 signers/leansphincs23-keccak/crosscheck.py --jobs 4
      - name: KAT fixture is what the sources produce
        run: python3 signers/leansphincs23-keccak/make_kat_fixture.py --check
      - name: forge test (KATs, tampering, spec model, random digests, verify-frame gas ceiling, 4337 account, ls23k FFI round-trips)
        run: forge test --match-contract LeanSphincs23Test -vv

  # ── Frozen legacy/ verifiers. These sit OUTSIDE the default `forge test` path
  #    (Foundry only scans test/), so they need an explicit job to be covered.
  #    Builds BOTH C signers: the fast-signer wrappers refuse a binary older than
  #    any .c/.h/Makefile beside it, so a missing or stale build fails here rather
  #    than signing under a superseded scheme. Slow because the two SLH-DSA-Keccak
  #    suites do real NIST-params signs.
  legacy-verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python signer deps
        run: pip install eth-account eth-abi requests pycryptodome
      - name: Build both SLH-DSA C reference signers (keccak one was never built in CI)
        run: |
          make -C signers/sphincsplus-128-24
          make -C signers/jardin-keccak-128-24
      - name: forge build
        run: forge build
      - name: forge test (legacy/ suites — C8/C10/C11/C12 + both SLH-DSA-Keccak)
        env:
          FOUNDRY_TEST: legacy/test
        run: forge test -vv

  # ── SLH-DSA-SHA2 noble-post-quantum parity. The live SHA-2-128-24 verifier is a
  #    FIPS 205 external SLH-DSA verify at a custom set (n=16,h=22,d=1,a=24,k=6,w=4);
  #    a 6-edit-patched @noble/post-quantum engine reproduces it bit-for-bit. Run at
  #    REDUCED H that is STILL > 16, so keygen exercises the widened key-pair-address
  #    field (the patch needed for leafIdx >= 2^16), against a matching reduced C
  #    build. noble and the C reference must agree on every byte. The full-parameter
  #    tie to the on-chain-verified KAT is signers/noble-slh-dsa/kat-check.mjs
  #    (a 2^22 pure-JS keygen — minutes — so it is a manual/offline gate, not here). ──
  noble-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install + patch noble (pinned versions, build/ regenerated)
        working-directory: signers/noble-slh-dsa
        run: npm ci && node patch-noble.mjs
      - name: Build REDUCED-parameter C reference signer (h=18, a=10)
        run: make -C signers/sphincsplus-128-24 clean && make -C signers/sphincsplus-128-24 CFLAGS="-O3 -std=c99 -I. -DSPX_FULL_HEIGHT=18 -DSPX_FORS_HEIGHT=10"
      - name: noble vs C bit-exact parity at the reduced params
        working-directory: signers/noble-slh-dsa
        run: |
          SEED=$(node -e "process.stdout.write('11'.repeat(48))")
          OPTRAND=$(node -e "process.stdout.write('00'.repeat(16))")
          MSG=deadbeef00000000000000000000000000000000000000000000000000000000
          node crosscheck.mjs "$SEED" "$MSG" "$OPTRAND" ../sphincsplus-128-24/slhdsa-sha2-128-24 --H 18 --A 10
