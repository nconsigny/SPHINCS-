[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
# Read-only access for the JSON KAT fixture (SLH-DSA-SHA2-128-24-JsonKAT.t.sol).
# - the JSON KAT fixture (SLH-DSA-SHA2-128-24-JsonKAT.t.sol)
# - build artifacts, so SphincsFrameAccountC13Test can load the compiled Yul module
#   (vm.getCode cannot resolve Yul artifacts — they carry no ABI)
fs_permissions = [
    { access = "read", path = "./signers/slhvk-sha2-128-24/kat-counter0.json" },
    { access = "read", path = "./out" },
]

remappings = [
    "account-abstraction/=lib/account-abstraction/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# src/SphincsFrameVerify.yul is a standalone Yul object — it needs `verbatim` for the
# EIP-8141 opcodes (TXPARAM/FRAMEPARAM/SIGPARAM/APPROVE), which Solidity inline
# assembly cannot express. solc compiles it via --strict-assembly fine, but forge lint
# parses every source as Solidity and dies on the `object "..."` header. The `ignore`
# key does not help (the parse happens before findings are filtered), so lint is off
# during build. Lint manually by naming Solidity paths, e.g.
#     forge lint $(git ls-files 'src/*.sol' 'test/*.sol')
[lint]
lint_on_build = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
