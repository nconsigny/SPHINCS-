[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
# Read-only access for:
# - the JSON KAT fixture (SLH-DSA-SHA2-128-24-JsonKAT.t.sol)
# - the JSON KAT fixtures under test/fixtures (LeanSphincsSTest, SphincsAccountLeanSphincsSTest, and the
#   leanSphincs, -f and -layered suites; the layered ones also read EthLib's vendored vectors there)
#   and legacy/test/fixtures (LeanSphincs23Test, SphincsAccountLeanSphincs23Test; legacy suites,
#   run with FOUNDRY_TEST=legacy/test)
# - build artifacts, so SphincsFrameAccountC13Test can load the compiled Yul module
#   (vm.getCode cannot resolve Yul artifacts — they carry no ABI)
fs_permissions = [
    { access = "read", path = "./signers/slhvk-sha2-128-24/kat-counter0.json" },
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "./legacy/test/fixtures" },
    { access = "read", path = "./out" },
]

remappings = [
    "account-abstraction/=lib/account-abstraction/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "safe-1.4.1/=lib/safe-smart-account-1.4.1/contracts/",
    "safe-1.5.0/=lib/safe-smart-account-1.5.0/contracts/",
    "safe-main/=lib/safe-smart-account-main/contracts/",
]

# Safe (safe-global/safe-smart-account) at v1.4.1, v1.5.0 and main 247b8ce, for
# test/SafePqOwners*.t.sol: unmodified sources, pinned as submodules. They are compiled the way
# upstream compiles them by default (solc 0.7.6, optimizer off), not with this profile: Safe
# 1.4.1 does not compile under via_ir (stack too deep). A restriction on a file also binds every
# file that imports it, so the only importers are the pragma-open files test/safe/SafeImports*.sol
# and the tests load the Safe artifacts by path (vm.getCode) instead of importing them.
additional_compiler_profiles = [
    { name = "safe", version = "0.7.6", via_ir = false, optimizer = false },
]
compilation_restrictions = [
    { paths = "lib/safe-smart-account-*/**", version = "0.7.6", via_ir = false, optimizer = false },
    { paths = "test/safe/SafeImports*.sol", version = "0.7.6", via_ir = false, optimizer = false },
]

# src/SphincsFrameVerify.yul is a standalone Yul object — it needs `verbatim` for the
# EIP-8141 opcodes (TXPARAM/FRAMEPARAM/SIGPARAM/APPROVE), which Solidity inline
# assembly cannot express. solc compiles it via --strict-assembly fine, but forge lint
# parses every source as Solidity and dies on the `object "..."` header. The `ignore`
# key does not help (the parse happens before findings are filtered), so lint is off
# during build. Lint manually by naming Solidity paths, e.g.
#     forge lint $(git ls-files 'src/*.sol' 'test/*.sol')
[lint]
lint_on_build = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
